<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem ligação</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0a0807;
      color: #f6e8c3;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    main { max-width: 320px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: #b9ab8f; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #e5a93c;
      color: #1a1208;
      font: inherit;
      font-weight: 700;
      padding: 14px 28px;
      min-width: 200px;
    }
    button:active { opacity: .8; }
    svg { width: 72px; height: 72px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="#e5a93c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.4a10 10 0 0 1 14 0"/><path d="M8.5 15.9a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/>
    </svg>
    <h1>Sem ligação à internet</h1>
    <p>Liga os dados móveis ou o Wi-Fi e tenta outra vez. O teu carrinho e o teu pedido não se perdem.</p>
    <button type="button" id="tentar">Tentar outra vez</button>
  </main>
  <script>
    // O endereço do site vem do capacitor.config.json (server.url); a app volta a ele.
    var tentar = document.getElementById('tentar');
    function voltar() {
      var cap = window.Capacitor;
      var url = (cap && cap.getServerUrl && cap.getServerUrl()) || '/';
      window.location.replace(url);
    }
    tentar.addEventListener('click', voltar);
    window.addEventListener('online', voltar);
  </script>
</body>
</html>
