name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e tipos
        run: pnpm lint

      - name: Testes
        run: pnpm test
